[build]
  command = "npm run build -w @revive-psg1/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  EARLY_ACCESS_FREE = "false"
  NEXT_PUBLIC_COMPATIBILITY_CHECKER_ONLY = "true"
  NEXT_PUBLIC_BETA_BROWSER_INSTALLER = "false"
  NEXT_PUBLIC_SALES_STATE = "closed"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https:; font-src 'self' data:; form-action 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests"

[[headers]]
  for = "/wizard"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/wizard/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"
