name: Bug report
description: Report a reproducible problem that does not expose sensitive data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Revive PSG1 is an unfinished, scan-only community handoff. Do not test destructive flashing on a real device."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Provide minimal scan-only or simulated-fixture steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node version, and commit. Redact device identifiers.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed serials, credentials, keys, firmware dumps, and personal data.
          required: true
        - label: I did not enable public flashing or run an unreviewed flash plan.
          required: true
